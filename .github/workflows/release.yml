# `v*` etiketi push edilince Windows kurulum paketini (NSIS) ve macOS paketini (Apple Silicon +
# Intel tek paket: .dmg ve güncelleyicinin .app.tar.gz'si) derler ve GitHub sürümü olarak
# YAYINLAR (taslak değil). Sürüm çıkarmak: tauri.conf.json + Cargo.toml + package.json'daki
# sürümü artır, commit'le, `git tag vX.Y.Z && git push origin vX.Y.Z`.
#
# Kurulu uygulamalar kendini bu sürümün `latest.json`'ından günceller (bkz. src-tauri/src/updater.rs).
# İki iş aynı sürüme yükler; tauri-action `latest.json`'ı birleştirir, her sistem kendi paketini bulur.
# Güncelleme paketi imzalı olmalı: depo sırları TAURI_SIGNING_PRIVATE_KEY ve
# TAURI_SIGNING_PRIVATE_KEY_PASSWORD gerekir (README → Sürüm çıkarma).
name: Build and Release

on:
  push:
    tags:
      - 'v*'
  # Elle tetiklerken dal yerine ETİKET seçilmeli; dalda koşarsa iş atlanır (aşağıdaki `if`).
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ''
            rust-targets: ''
          # Tek paket iki işlemciye: tauri-action latest.json'a darwin-aarch64 ve darwin-x86_64 yazar.
          - os: macos-latest
            args: '--target universal-apple-darwin'
            rust-targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Etiket ile uygulama sürümü ayrışırsa kurulum dosyasının adı ve "Hakkında" sürümü
      # etiketten farklı olurdu; derlemeden önce durdur.
      - name: Etiket sürümle uyumlu mu
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          $conf = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $cargo = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          if ("v$conf" -ne $tag -or $pkg -ne $conf -or $cargo -ne $conf) {
            throw "Etiket $tag, tauri.conf.json $conf, package.json $pkg, Cargo.toml $cargo — hepsi aynı olmalı."
          }

      # Anahtar yoksa tauri build ancak derlemenin sonunda hata verir; baştan durdur.
      - name: İmza anahtarı tanımlı mı
        shell: pwsh
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if (-not $env:KEY -or -not $env:PASSWORD) {
            throw "TAURI_SIGNING_PRIVATE_KEY / TAURI_SIGNING_PRIVATE_KEY_PASSWORD depo sırları tanımlı değil (README → Sürüm çıkarma)."
          }

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: release-${{ matrix.os }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - run: npm ci

      - name: cargo test
        working-directory: ./src-tauri
        run: cargo test

      # `npm run tauri build` çalıştırır; xterm dosyaları tauri.conf.json → beforeBuildCommand ile
      # kopyalanır. `createUpdaterArtifacts` açık olduğu için kurulum paketi imzalanır (.sig) ve
      # eylem sürüme `latest.json` ekler; uygulama güncellemeyi oradan bulur.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'SessionBoard ${{ github.ref_name }}'
          includeUpdaterJson: true
          args: ${{ matrix.args }}
          releaseBody: |
            Kurulu SessionBoard (Windows'ta v0.2.0 ve sonrası) bu sürümü kendisi bulur ve günceller.

            **Windows:** `SessionBoard_*_x64-setup.exe`
            - Yönetici izni istemez; yalnız kullanıcı için kurulur.
            - Kod imzası yok: Windows SmartScreen uyarı verebilir → **Ek bilgi** → **Yine de çalıştır**.

            **macOS (Apple Silicon ve Intel):** `SessionBoard_*_universal.dmg`
            - Açıp SessionBoard'u Uygulamalar klasörüne sürükleyin.
            - Apple tarafından onaylı değil: ilk açılışta macOS uyarır → **Sistem Ayarları › Gizlilik ve Güvenlik › Yine de Aç**.

            Gömülü terminal için bağımsız Claude Code CLI gerekir — bkz. README → [Paketi indirip kurmak](https://github.com/${{ github.repository }}#paketi-indirip-kurmak).
          releaseDraft: false
          prerelease: false
