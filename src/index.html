<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SessionBoard</title>
  <link rel="stylesheet" href="vendor/xterm.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <aside id="side">
    <header>
      <label class="search">
        <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        <input id="search" type="search" placeholder="Oturum ara (Ctrl+F)" spellcheck="false" autocomplete="off" />
      </label>
      <button id="fav-toggle" class="icon-btn" title="Yalnız favori klasörler" aria-label="Yalnız favori klasörler" aria-pressed="false">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.9l1.8 3.75 4.1.55-3 2.85.75 4.05L8 11.15 4.35 13.1l.75-4.05-3-2.85 4.1-.55z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
      </button>
      <button id="refresh" class="icon-btn" title="Yenile (F5)" aria-label="Yenile">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13.25 8a5.25 5.25 0 1 1-1.54-3.71" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M12.25 1.75v2.75H9.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button id="menu" class="icon-btn" title="Görünüm" aria-label="Görünüm">
        <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="3.5" cy="8" r="1.3" fill="currentColor"/><circle cx="8" cy="8" r="1.3" fill="currentColor"/><circle cx="12.5" cy="8" r="1.3" fill="currentColor"/></svg>
      </button>
    </header>
    <main id="tree" role="tree" aria-label="Oturumlar"></main>
    <footer>
      <span id="status"></span>
      <span id="status-right"></span>
    </footer>
  </aside>
  <div id="splitter" role="separator" aria-orientation="vertical" title="Sürükleyerek genişlet"></div>
  <section id="term-area" aria-label="Terminaller">
    <div id="term-tabs" role="tablist"></div>
    <div id="term-body"></div>
  </section>
  <script src="vendor/xterm.js"></script>
  <script src="vendor/addon-fit.js"></script>
  <script src="terminal.js"></script>
  <script src="app.js"></script>
</body>
</html>
