[package]
name = "sessionboard"
version = "0.1.0"
description = "Claude Code oturumlarını workspace → grup → oturum ağacında düzenler"
authors = ["Nurullah YAYAN"]
license = "ISC"
edition = "2021"
rust-version = "1.82"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Gömülü terminal: Windows'ta ConPTY üzerinden sözde terminal.
portable-pty = "0.9"

[profile.release]
opt-level = 3
strip = true
